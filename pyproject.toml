[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstrakcyjna-symulacja-kaskady-sieciowej"
version = "0.1.0"
description = "Refaktoryzowany model system dynamics z jednym entrypointem i spójną konfiguracją"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "SALib>=1.5",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "joblib>=1.4",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
